# loki.yml — AGGREGATOR CONFIG
# Single-binary mode, filesystem storage.
# Suitable for homelab/demo scale — swap object_store for S3/GCS for production.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /etc/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period:        ${LOKI_RETENTION:-744h}
  ingestion_rate_mb:       8
  ingestion_burst_size_mb: 16
  max_streams_per_user:    10000
  reject_old_samples:      true
  reject_old_samples_max_age: 168h

compactor:
  working_directory:       /loki/compactor
  retention_enabled:       true
  delete_request_store:    filesystem

# Ruler — recording rules turn log volume into Prometheus metrics.
# Rules live in git at config/loki/rules/<tenant>/ (tenant is "fake" with
# auth disabled) and are re-read every poll_interval, so rule edits land
# without a restart. Results are remote-written to Prometheus, which already
# runs with --web.enable-remote-write-receiver.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  evaluation_interval: 1m
  poll_interval: 1m
  enable_api: true
  wal:
    dir: /loki/ruler-wal
  remote_write:
    enabled: true
    clients:
      prometheus:
        url: http://obs-prometheus:9090/api/v1/write
